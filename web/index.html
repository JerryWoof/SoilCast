<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%2710%204%2060%2080%27%3E%3Cdefs%3E%3CclipPath%20id%3D%27d%27%3E%3Cpath%20d%3D%27M40%206C40%206%2014%2038%2014%2056a26%2026%200%200%200%2052%200C66%2038%2040%206%2040%206z%27/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%27url%28%23d%29%27%3E%3Crect%20x%3D%270%27%20y%3D%270%27%20width%3D%2780%27%20height%3D%2746%27%20fill%3D%27%232a9ba8%27/%3E%3Crect%20x%3D%270%27%20y%3D%2746%27%20width%3D%2780%27%20height%3D%2712%27%20fill%3D%27%23c9a46a%27/%3E%3Crect%20x%3D%270%27%20y%3D%2758%27%20width%3D%2780%27%20height%3D%2712%27%20fill%3D%27%239a7048%27/%3E%3Crect%20x%3D%270%27%20y%3D%2770%27%20width%3D%2780%27%20height%3D%2720%27%20fill%3D%27%236b4a36%27/%3E%3C/g%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Půdoměr – teplota a vlhkost půdy v Česku</title>
    <meta name="description" content="Teplota a vlhkost půdy kdekoli v Česku od povrchu do 1 m: teď i s výhledem na 5 dní. Zdarma, bez registrace." />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    
    <script>
      // Language for <html lang> before first paint (same rule as src/i18n.js pickLang): ?lang=, saved choice, else Czech system -> cs, otherwise en.
      (function () { try { var n = function (v) { v = String(v || '').toLowerCase().split(/[-_]/)[0]; return v === 'cs' || v === 'en' ? v : null; }; var s = null; try { s = localStorage.getItem('soilcast.lang'); } catch (e) {} var f = (navigator.languages && navigator.languages[0]) || navigator.language || ''; document.documentElement.lang = n(new URLSearchParams(location.search).get('lang')) || n(s) || (String(f).toLowerCase().indexOf('cs') === 0 ? 'cs' : 'en'); } catch (e) {} })();
    </script>
    <script>
      try { const t = JSON.parse(localStorage.getItem('soilcast.settings.v1') || '{}').theme; document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body class="mappage" data-page="map">
    <header class="top">
      <a class="brand" href="./" aria-label="Půdoměr"><svg class="logo" viewBox="10 4 60 80" aria-hidden="true"><defs><clipPath id="logo-drop"><path d="M40 6C40 6 14 38 14 56a26 26 0 0 0 52 0C66 38 40 6 40 6z"/></clipPath></defs><g clip-path="url(#logo-drop)"><rect x="0" y="0" width="80" height="46" fill="#2a9ba8"/><rect x="0" y="46" width="80" height="12" fill="#c9a46a"/><rect x="0" y="58" width="80" height="12" fill="#9a7048"/><rect x="0" y="70" width="80" height="20" fill="#6b4a36"/></g></svg><span class="brand-name">Půdoměr</span></a>
      <nav>
        <a data-i18n="nav.map" href="./" aria-current="page">Mapa</a>
        <a href="presnost.html" data-i18n="nav.accuracy">Přesnost</a>
        <a href="jak-to-funguje.html" data-i18n="nav.how">Jak to funguje</a>
      </nav>
      <div id="lang"></div>
      <button id="theme" class="iconbtn" type="button" data-i18n-attr="aria-label:theme.label;title:theme.label" aria-label="Barevný režim" title="Barevný režim"></button>
    </header>
    <div id="status" class="status" role="status" data-i18n="status.loading">Načítám…</div>
    <main class="mapwrap">
      <div id="map" data-i18n-attr="aria-label:map.aria" aria-label="Mapa Česka"></div>
      <section id="controls" class="controls" data-i18n-attr="aria-label:controls.aria" aria-label="Nastavení mapy">
        <div id="days" class="days" role="radiogroup" data-i18n-attr="aria-label:days.aria" aria-label="Den"></div>
        <div id="legend" class="legend"></div>
        <div class="ctlrow">
          <label class="check"><input id="stations" type="checkbox" /> <span data-i18n="stations.check">Stanice ČHMÚ</span></label>
          <button id="locate" class="linkbtn" type="button" data-i18n="locate">Moje poloha</button>
        </div>
        <div class="pick">
          <div class="lab" data-i18n="pick.group">Veličina</div>
          <div id="groups" class="seg" role="radiogroup" data-i18n-attr="aria-label:layers.aria" aria-label="Vrstva"></div>
          <div id="depthrow"><div class="lab" data-i18n="pick.depth">Hloubka</div>
          <div id="depths" class="depths" role="radiogroup" data-i18n-attr="aria-label:pick.depth" aria-label="Hloubka"></div></div>
        </div>
      </section>
      <aside id="panel" class="panel" hidden aria-live="polite"></aside>
      <p id="hint" class="hint"><span class="hint-long"></span><span class="hint-short" data-i18n="hint.short">Klepněte kamkoli do mapy Česka.</span></p>
    </main>
    <footer class="sitefoot" data-i18n-html="foot.site"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
