    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SoilCast – teplota a vlhkost půdy v Česku</title>
    <meta name="description" content="Teplota a vlhkost půdy kdekoli v Česku od povrchu do 1 m: teď a na 5 dní dopředu. Zdarma, bez registrace." />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    
    <script>
      try { const t = JSON.parse(localStorage.getItem('soilcast.settings.v1') || '{}').theme; document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body class="mappage">
    <header class="top">
      <a class="brand" href="./"><svg class="logo" viewBox="10 4 60 80" aria-hidden="true"><defs><clipPath id="logo-drop"><path d="M40 6C40 6 14 38 14 56a26 26 0 0 0 52 0C66 38 40 6 40 6z"/></clipPath></defs><g clip-path="url(#logo-drop)"><rect x="0" y="0" width="80" height="46" fill="#2a9ba8"/><rect x="0" y="46" width="80" height="12" fill="#c9a46a"/><rect x="0" y="58" width="80" height="12" fill="#9a7048"/><rect x="0" y="70" width="80" height="20" fill="#6b4a36"/></g></svg>SoilCast</a>
      <nav>
        <a href="./" aria-current="page">Mapa</a>
        <a href="presnost.html">Přesnost</a>
        <a href="jak-to-funguje.html">Jak to funguje</a>
      </nav>
      <button id="theme" class="iconbtn" type="button" aria-label="Barevný režim" title="Barevný režim"></button>
    </header>
    <div id="status" class="status" role="status">Načítám…</div>
    <main class="mapwrap">
      <div id="map" aria-label="Mapa Česka"></div>
      <section id="controls" class="controls" aria-label="Nastavení mapy">
        <div id="layers" class="seg" role="radiogroup" aria-label="Vrstva"></div>
        <div id="days" class="days" role="radiogroup" aria-label="Den"></div>
        <div id="legend" class="legend"></div>
        <div class="ctlrow">
          <label class="check"><input id="stations" type="checkbox" /> Stanice ČHMÚ</label>
          <button id="locate" class="linkbtn" type="button">Moje poloha</button>
        </div>
      </section>
      <aside id="panel" class="panel" hidden aria-live="polite"></aside>
      <p id="hint" class="hint">Klikněte kamkoli do mapy Česka.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
